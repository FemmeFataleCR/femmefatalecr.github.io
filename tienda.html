<body data-page="tienda">
<div data-mount="header" style="min-height:103px"></div>

<main id="main">
  <div class="container">
    <header class="page-head">
      <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a><span aria-hidden="true">/</span><span id="crumb-current">Tienda</span></nav>
      <h1 id="shop-title">Toda la tienda</h1>
      <p id="shop-intro">Rhode, Rare Beauty, los más vendidos de Sephora y Yves Rocher, y lo mejor del skincare coreano. Si no encuentras tu tono, escríbenos y lo buscamos contigo.</p>
    </header>

    <div class="shop-layout">
      <aside class="filters" id="filters-desktop" aria-label="Filtros"></aside>

      <div>
        <div class="toolbar">
          <button class="filter-toggle" type="button" id="open-filters" aria-haspopup="dialog"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i>Filtrar</button>
          <span class="count" id="count" aria-live="polite"></span>
          <div class="select">
            <label class="sr-only" for="sort">Ordenar por</label>
            <select id="sort">
              <option value="destacados">Destacados</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="valorados">Mejor valorados</option>
              <option value="novedades">Novedades</option>
            </select>
          </div>
        </div>
        <div class="active-chips" id="active-chips" style="margin-top:16px"></div>
        <div class="product-grid" id="grid" style="margin-top:28px"></div>
      </div>
    </div>
  </div>
</main>

<dialog class="drawer drawer--left filter-sheet" id="filter-sheet" aria-label="Filtros">
  <div class="drawer-head"><h2>Filtrar</h2><button class="icon-btn" type="button" data-close aria-label="Cerrar filtros"><i class="ph ph-x" aria-hidden="true"></i></button></div>
  <div class="drawer-body" id="filters-mobile"></div>
  <div class="drawer-foot"><button class="btn btn--block" type="button" data-close id="apply-filters"><span>Ver productos</span></button></div>
</dialog>

<div data-mount="footer"></div>

<script src="assets/js/data.js?v=16"></script>
<script src="assets/js/app.js?v=16"></script>
<script src="assets/js/shop.js?v=16"></script>
</body>
</html>
