<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Logo Femme Fatale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="../assets/css/styles.css?v=16">
<style>
  body { background: #E9E4DE; color: #231E21; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center; }
  .avatar { width: 640px; height: 640px; border-radius: 50%; background: #FBF8F3; display: grid; place-items: center; }
  .avatar .logo { --logo: 76px; color: #231E21; }
  .flat { padding: 60px 80px; display: inline-grid; place-items: center; }
  .flat .logo { --logo: 76px; }
  .flat.dark { background: #151113; }
  .flat.dark .logo { color: #F2ECE8; }
  .flat.light .logo { color: #231E21; }
</style>
</head>
<body>
  <div class="avatar" id="avatar"><span class="logo"><span class="logo-mark"><span class="logo-f">F</span><span class="logo-emme">EMME</span><span class="logo-star"></span></span><span class="logo-caps">Fatale</span></span></div>
  <div class="flat light" id="flat-light"><span class="logo"><span class="logo-mark"><span class="logo-f">F</span><span class="logo-emme">EMME</span><span class="logo-star"></span></span><span class="logo-caps">Fatale</span></span></div>
  <div class="flat dark" id="flat-dark"><span class="logo"><span class="logo-mark"><span class="logo-f">F</span><span class="logo-emme">EMME</span><span class="logo-star"></span></span><span class="logo-caps">Fatale</span></span></div>
</body>
</html>
