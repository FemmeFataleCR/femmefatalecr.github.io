<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Producto | Femme Fatale CR</title>
<meta name="description" content="Maquillaje y belleza con entrega personal en Heredia y envíos a todo Costa Rica.">
<meta name="theme-color" content="#FAF7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151113" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="product">
<meta property="og:locale" content="es_CR">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FAF7F4'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-style='italic' font-size='42' text-anchor='middle' fill='%23231E21'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="assets/css/styles.css?v=15">
</head>
<body data-page="tienda">
<div data-mount="header" style="min-height:103px"></div>

<main id="main">
  <div class="container" id="pdp-root">
    <!-- Esqueleto mientras carga -->
    <div class="pdp" style="padding-top:32px" aria-busy="true">
      <div class="gallery"><div class="gallery-slide skeleton"></div></div>
      <div class="buy"><div class="skeleton" style="height:40px;width:70%"></div><div class="skeleton" style="height:24px;width:30%;margin-top:18px"></div><div class="skeleton" style="height:52px;margin-top:40px"></div></div>
    </div>
  </div>

  <section class="section" id="resenas" aria-labelledby="rev-title" hidden>
    <div class="container">
      <div class="section-head"><div><h2 id="rev-title">Reseñas</h2><p id="rev-summary"></p></div></div>
      <div class="empty" style="padding-top:24px;border-top:1px solid var(--line)">
        <i class="ph ph-chat-circle-text" aria-hidden="true"></i>
        <h3>¿Ya lo probaste?</h3>
        <p>Cuéntanos qué te pareció. Publicamos solo reseñas de clientas con compra verificada.</p>
        <a class="btn btn--ghost" id="rev-cta" target="_blank" rel="noopener" href="#"><span>Dejar mi reseña</span></a>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0" aria-labelledby="rel-title" id="related-wrap" hidden>
    <div class="container">
      <div class="section-head"><h2 id="rel-title">Completa el look</h2></div>
      <div class="carousel" id="related" tabindex="0" aria-label="Productos relacionados"></div>
    </div>
  </section>
</main>

<div data-mount="footer"></div>

<script src="assets/js/data.js?v=15"></script>
<script src="assets/js/app.js?v=15"></script>
<script src="assets/js/product.js?v=15"></script>
</body>
</html>
